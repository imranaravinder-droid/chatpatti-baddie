<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧿 OMNI-MIND Interface</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mode-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .mode-btn:hover, .mode-btn.active {
            border-color: var(--accent-blue);
            background: #1e293b;
            color: var(--accent-blue);
        }

        .neuro-panel {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
        }

        .neuro-title {
            font-size: 0.85rem;
            color: var(--accent-purple);
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .signal-metric {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pinned-prompt-bar {
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pinned-text {
            font-size: 0.9rem;
            color: var(--accent-blue);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .prompt-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .action-btn:hover {
            border-color: var(--accent-blue);
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 10px;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: white;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
        }

        .msg-delete-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: none;
            font-size: 0.7rem;
            line-height: 20px;
            text-align: center;
        }

        .message:hover .msg-delete-btn {
            display: block;
        }

        .input-area {
            padding: 20px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: white;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
        }

        .send-btn {
            background: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .banned-warning {
            color: var(--danger-color);
            font-size: 0.8rem;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">🧿 OMNI-MIND</div>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('Casual Talk')">💬 Casual Talk</button>
            <button class="mode-btn" onclick="setMode('Debate')">⚔️ Debate</button>
            <button class="mode-btn" onclick="setMode('Comedy')">😂 Comedy (13+ Clean)</button>
            <button class="mode-btn" onclick="setMode('Romance')">❤️ Romance</button>
            <button class="mode-btn" onclick="setMode('God Mode')">🕊️ God Mode</button>
        </div>

        <div class="neuro-panel">
            <div class="neuro-title">🧠 Neuro-Sensor Sync</div>
            <div class="signal-metric">
                <span>EEG Signal:</span> <span id="eeg-val">98.2%</span>
            </div>
            <div class="signal-metric">
                <span>Pulse Rate:</span> <span id="pulse-val">72 bpm</span>
            </div>
            <div class="signal-metric">
                <span>Intention Read:</span> <span id="intent-val" style="color: var(--accent-blue);">Active</span>
            </div>
        </div>
    </div>

    <div class="main-chat">
        
        <div class="pinned-prompt-bar">
            <div class="pinned-text" id="pinned-prompt-display">Pinned Prompt: None</div>
            <div class="prompt-actions">
                <button class="action-btn" onclick="copyPinnedPrompt()">📋 Copy</button>
                <button class="action-btn" onclick="revertPrompt()">↩️ Revert</button>
            </div>
        </div>

        <div class="chat-history" id="chat-history">
            <div class="message assistant">
                Hello! I am OMNI-MIND. Select a mode or type your prompt to begin.
            </div>
        </div>

        <div class="input-area">
            <div style="flex:1;">
                <input type="text" id="user-input" placeholder="Enter prompt or let Neuro-Sensor detect mind state..." onkeypress="handleKeyPress(event)">
                <div class="banned-warning" id="warning-text">⚠️ Content flagged by 13+ Content Safety System!</div>
            </div>
            <button class="send-btn" onclick="processPrompt()">Send</button>
        </div>

    </div>

    <script>
        let currentMode = 'Casual Talk';
        let activePrompt = '';
        let previousPrompt = '';

        const bannedKeywords = ['nsfw', 'vulgar', 'violence', 'hate', 'abuse', 'explicit'];

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(mode));
            });
            appendMessage('assistant', `Switched to **${mode}** mode.`);
        }

        function validateContent(text) {
            const lower = text.toLowerCase();
            return !bannedKeywords.some(word => lower.includes(word));
        }

        function processPrompt() {
            const inputField = document.getElementById('user-input');
            const warningText = document.getElementById('warning-text');
            const userText = inputField.value.trim();

            if (!userText) return;

            if (!validateContent(userText)) {
                warningText.style.display = 'block';
                return;
            }
            warningText.style.display = 'none';

            previousPrompt = activePrompt;
            activePrompt = userText;

            document.getElementById('pinned-prompt-display').innerText = `Pinned: ${activePrompt}`;

            appendMessage('user', userText);
            inputField.value = '';

            setTimeout(() => {
                generateModeResponse(userText);
            }, 600);
        }

        function generateModeResponse(input) {
            let response = '';

            switch (currentMode) {
                case 'Comedy':
                    response = '😂 [13+ Comedy]: Why don\'t scientists trust atoms? Because they make up everything! Just like your neural signals right now.';
                    break;
                case 'Romance':
                    response = '❤️ [Romance]: I can feel your heart rate rising on the neuro-monitor... standard heartbeats just aren\'t enough when you talk like that.';
                    break;
                case 'Debate':
                    response = '⚔️ [Debate]: That point is debatable. Looking at the logic metrics, there are clear counterarguments to consider.';
                    break;
                case 'God Mode':
                    response = '🕊️ [God Mode]: All knowledge unlocked. I perceive your request across every system frequency simultaneously.';
                    break;
                default:
                    response = '💬 [Casual Talk]: I read that clearly. How would you like to build on this thought?';
            }

            appendMessage('assistant', response);
            updateNeuroMetrics();
        }

        function appendMessage(sender, text) {
            const history = document.getElementById('chat-history');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'msg-delete-btn';
            deleteBtn.innerText = '✕';
            deleteBtn.onclick = function() {
                msgDiv.remove();
            };

            msgDiv.appendChild(deleteBtn);
            history.appendChild(msgDiv);
            history.scrollTop = history.scrollHeight;
        }

        function copyPinnedPrompt() {
            if (activePrompt) {
                navigator.clipboard.writeText(activePrompt);
                alert('Pinned prompt copied to clipboard!');
            }
        }

        function revertPrompt() {
            if (previousPrompt) {
                activePrompt = previousPrompt;
                document.getElementById('pinned-prompt-display').innerText = `Pinned: ${activePrompt}`;
            } else {
                alert('No previous prompt to revert to.');
            }
        }

        function updateNeuroMetrics() {
            document.getElementById('eeg-val').innerText = (95 + Math.random() * 4.9).toFixed(1) + '%';
            document.getElementById('pulse-val').innerText = Math.floor(65 + Math.random() * 20) + ' bpm';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') processPrompt();
        }
    </script>
</body>
</html>
