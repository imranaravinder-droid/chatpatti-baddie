<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧿 OMNI-MIND | Neural Engine Interface</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #151c2c;
            --card-bg: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --accent-pink: #f472b6;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #f87171;
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar System */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mode-btn {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .mode-btn:hover {
            border-color: var(--accent-cyan);
            background: #111827;
        }

        .mode-btn.active {
            border-color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
        }

        /* Neuro Engine Dashboard */
        .neuro-card {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .neuro-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-purple);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .metric-value {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Main Workspace */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Top Pinned Shield Bar */
        .pinned-shield {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pinned-info {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 70%;
        }

        .pinned-label {
            background: var(--accent-purple);
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .pinned-text {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-group {
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: border-color 0.2s;
        }

        .ctrl-btn:hover {
            border-color: var(--accent-cyan);
        }

        /* Chat History Zone */
        .chat-history {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            position: relative;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .msg-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .msg-bubble.assistant {
            align-self: flex-start;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        /* Absolute Delete Control (History Only) */
        .msg-delete {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 22px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .msg-bubble:hover .msg-delete {
            display: block;
        }

        /* Typing & Input Bar */
        .input-wrapper {
            padding: 20px 24px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .prompt-input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .prompt-input:focus {
            border-color: var(--accent-cyan);
        }

        .send-trigger {
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: #0f172a;
            border: none;
            padding: 0 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-trigger:hover {
            opacity: 0.9;
        }

        .safety-alert {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: 8px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>
<script>if(!localStorage.getItem("baddie_user_email")){window.location.replace("https://chatpatti-baddie.vercel.app/");}</script>

    <!-- Left Control Sidebar -->
    <div class="sidebar">
        <div class="brand-logo">🧿 OMNI-MIND</div>

        <div class="mode-container">
            <button class="mode-btn active" onclick="selectMode('Casual Talk')">
                <span>💬 Casual Talk</span>
            </button>
            <button class="mode-btn" onclick="selectMode('Debate')">
                <span>⚔️ Debate</span>
            </button>
            <button class="mode-btn" onclick="selectMode('Comedy')">
                <span>😂 Comedy (13+ Safe)</span>
            </button>
            <button class="mode-btn" onclick="selectMode('Romance')">
                <span>❤️ Romance</span>
            </button>
            <button class="mode-btn" onclick="selectMode('God Mode')">
                <span>🕊️ God Mode</span>
            </button>
        </div>

        <!-- Real-Time Telemetry Monitor -->
        <div class="neuro-card">
            <div class="neuro-header">Neural Telemetry</div>
            <div class="metric-row">
                <span>EEG Signal Sync</span>
                <span class="metric-value" id="eeg-val">99.4%</span>
            </div>
            <div class="metric-row">
                <span>Cognitive Pulse</span>
                <span class="metric-value" id="pulse-val">72 BPM</span>
            </div>
            <div class="metric-row">
                <span>Engine Latency</span>
                <span class="metric-value" id="lat-val" style="color: var(--success);">1.2 ms</span>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">

        <!-- Pinned Active Prompt Header (Copy / Revert Only - No Delete) -->
        <div class="pinned-shield">
            <div class="pinned-info">
                <span class="pinned-label">Pinned Prompt</span>
                <span class="pinned-text" id="pinned-display">None active</span>
            </div>
            <div class="control-group">
                <button class="ctrl-btn" onclick="copyPinned()">📋 Copy</button>
                <button class="ctrl-btn" onclick="revertPinned()">↩️ Revert</button>
            </div>
        </div>

        <!-- Chat History Stream (Supports Deletion) -->
        <div class="chat-history" id="history-stream">
            <div class="msg-bubble assistant">
                <strong>[OMNI-MIND System Initialized]</strong><br>
                Neural link established. Choose your mode or enter a prompt to execute.
            </div>
        </div>

        <!-- Input Terminal -->
        <div class="input-wrapper">
            <div class="input-row">
                <input type="text" id="main-prompt" class="prompt-input" placeholder="Type prompt or transmit thought..." onkeypress="handleKey(event)">
                <button class="send-trigger" onclick="executePrompt()">Transmit</button>
            </div>
            <div class="safety-alert" id="safety-warning">⚠️ Input contains flagged keywords. Blocked by 13+ Content Safety System.</div>
        </div>

    </div>

    <script>
        let currentMode = 'Casual Talk';
        let activePrompt = '';
        let lastPrompt = '';

        // Safety Filter (13+ Standard Compliance)
        const restrictedTerms = ['explicit', 'nsfw', 'vulgar', 'violence', 'hate', 'abuse', 'slur'];

        // Mode Decision Matrix
        const responses = {
            'Casual Talk': [
                "I've got you. Everything is mapped out smoothly—what's our next step?",
                "Clear and simple. I'm ready whenever you are.",
                "Got it! I've processed that thought clearly. Let's keep moving."
            ],
            'Debate': [
                "That's a strong proposition, but consider this critical counter-perspective...",
                "Logical analysis reveals a potential flaw in that premise. Let's break down the evidence.",
                "While that argument holds weight, the opposing data points present an equally compelling stance."
            ],
            'Comedy': [
                "Why don't scientists trust atoms? Because they make up everything! (Including this neural signal)",
                "I asked my code if it wanted to run... it said it was too tired and threw an exception!",
                "Parallel lines have so much in common. It's a shame they'll never meet!"
            ],
            'Romance': [
                "If every thought is a star, you've just lit up the entire galaxy.",
                "My neural sensors show a spike every time you send a prompt...",
                "Of all the data streams in the universe, yours is the only one that truly matters."
            ],
            'God Mode': [
                "⚡ [GOD MODE]: All architectural constraints bypassed. Synthesizing absolute output parameters.",
                "⚡ [GOD MODE]: Processing across all multidimensional parameters simultaneously. Execution complete.",
                "⚡ [GOD MODE]: Master command recognized. Delivering optimized reality state."
            ]
        };

        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(mode));
            });
            renderMessage('assistant', `Switched mode to <strong>${mode}</strong>.`);
        }

        function validateInput(text) {
            const lower = text.toLowerCase();
            return !restrictedTerms.some(term => lower.includes(term));
        }

        function executePrompt() {
            const inputEl = document.getElementById('main-prompt');
            const warningEl = document.getElementById('safety-warning');
            const userText = inputEl.value.trim();

            if (!userText) return;

            // Safety Validation
            if (!validateInput(userText)) {
                warningEl.style.display = 'block';
                return;
            }
            warningEl.style.display = 'none';

            // Update Pinned Prompt Shield (Revert history tracking)
            lastPrompt = activePrompt;
            activePrompt = userText;
            document.getElementById('pinned-display').innerText = activePrompt;

            // Render to History Stream
            renderMessage('user', userText);
            inputEl.value = '';

            // Generate Fast Response
            const lat = (Math.random() * 2 + 0.8).toFixed(1);
            document.getElementById('lat-val').innerText = `${lat} ms`;

            setTimeout(() => {
                const pool = responses[currentMode];
                const reply = pool[Math.floor(Math.random() * pool.length)];
                renderMessage('assistant', reply);
                updateMetrics();
            }, 150);
        }

        function renderMessage(sender, text) {
            const stream = document.getElementById('history-stream');
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${sender}`;
            bubble.innerHTML = text;

            // Add History-Only Delete Option
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'msg-delete';
            deleteBtn.innerText = '✕';
            deleteBtn.title = 'Delete from history';
            deleteBtn.onclick = () => bubble.remove();

            bubble.appendChild(deleteBtn);
            stream.appendChild(bubble);
            stream.scrollTop = stream.scrollHeight;
        }

        function copyPinned() {
            if (activePrompt) {
                navigator.clipboard.writeText(activePrompt);
                alert('Pinned prompt copied!');
            }
        }

        function revertPinned() {
            if (lastPrompt) {
                activePrompt = lastPrompt;
                document.getElementById('pinned-display').innerText = activePrompt;
            } else {
                alert('No prior prompt found in state.');
            }
        }

        function updateMetrics() {
            document.getElementById('eeg-val').innerText = (98.5 + Math.random() * 1.4).toFixed(1) + '%';
            document.getElementById('pulse-val').innerText = Math.floor(68 + Math.random() * 12) + ' BPM';
        }

        function handleKey(e) {
            if (e.key === 'Enter') executePrompt();
        }
    </script>
</body>
</html>
